<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIH26085</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <style>
        body { font-family: system-ui, sans-serif; max-width: 48rem; margin: 3rem auto; padding: 0 1rem; }
        button { font-size: 1rem; padding: .6rem 1.2rem; cursor: pointer; }
        .warn { color: #b3261e; font-size: .85em; }

        #location-status { margin-top: 1rem; font-family: ui-monospace, monospace; line-height: 1.6; }

        #district-form { margin-top: 1.5rem; display: flex; gap: .5rem; flex-wrap: wrap; }
        #district { flex: 1 1 14rem; font-size: 1rem; padding: .55rem .7rem; }

        #weather { margin-top: .75rem; }
        #weather table { border-collapse: collapse; }
        #weather td { padding: .2rem .9rem .2rem 0; }
        #weather td:first-child { color: #5f6368; }

        #forecast { margin-top: 1.25rem; }
        #forecast table { border-collapse: collapse; width: 100%; max-width: 32rem; margin-top: .4rem; }
        #forecast td { padding: .25rem .5rem .25rem 0; white-space: nowrap; }
        #forecast td:nth-child(2) { width: 45%; }
        #forecast td:nth-child(n+3) { text-align: right; color: #5f6368; }
        .bar { display: inline-block; height: .7rem; min-width: 1px; background: #4285f4;
               border-radius: 2px; vertical-align: middle; }

        .timeline { max-width: 32rem; margin: .6rem 0 1rem; }
        .timeline input[type=range] { width: 100%; margin: 0; }
        .ticks { display: flex; justify-content: space-between; font-size: .72rem; color: #80868b;
                 margin-top: .15rem; }
        .ticks .on { color: #1a73e8; font-weight: 600; }
        .readout { margin-top: .5rem; display: flex; flex-wrap: wrap; align-items: baseline;
                   gap: .1rem .75rem; }
        .readout strong { flex-basis: 100%; }
        .readout-rain { font-size: 1.35rem; color: #1a73e8; }
        .readout-extra { color: #5f6368; }

        .next-rain { margin: .5rem 0 .25rem; padding: .6rem .75rem; max-width: 32rem;
                     background: #e8f0fe; border-radius: .4rem; }
        .next-rain-headline { font-size: 1.05rem; font-weight: 600; color: #174ea6; }
        .next-rain-detail { margin-top: .15rem; color: #3c4043; }
        .next-rain-note { margin-top: .15rem; font-size: .78rem; color: #5f6368; }

        #map { height: 26rem; margin-top: 1rem; border-radius: .5rem; }

        .rain-control { background: #fff; padding: .45rem .6rem; font-size: .8rem; min-width: 15rem; }
        .rain-control[hidden] { display: none; }
        .rain-control-title { font-weight: 600; margin-bottom: .3rem; }
        .rain-control-row { display: flex; align-items: center; gap: .45rem; }
        .rain-control button { font-size: .8rem; padding: .15rem .5rem; }
        .rain-control input[type=range] { flex: 1; min-width: 5rem; }
        .rain-time { min-width: 4.5rem; text-align: right; font-variant-numeric: tabular-nums; }
        .rain-legend { display: flex; flex-wrap: wrap; gap: .15rem .6rem; margin-top: .35rem; color: #5f6368; }
        .rain-legend i { display: inline-block; width: .7rem; height: .7rem; margin-right: .25rem;
                         border-radius: 2px; vertical-align: -1px; }
        .rain-note:not(:empty) { margin-top: .25rem; color: #5f6368; }

        #rain-data { margin-top: 1rem; font-size: .85rem; }
        #rain-data h2 { font-size: 1rem; margin: 0 0 .4rem; }
        #rain-data code { font-size: .78rem; background: #f1f3f4; padding: .1rem .3rem;
                          border-radius: 3px; word-break: break-all; }
        .rain-data-filters { margin: .3rem 0 .75rem; padding-left: 1.2rem; color: #3c4043; }
        .rain-data-tables { display: flex; flex-wrap: wrap; gap: 1rem; align-items: flex-start; }
        .rain-data-caption { font-weight: 600; margin-bottom: .25rem; }
        .rain-data-scroll { max-height: 17rem; overflow: auto; max-width: 100%;
                            border: 1px solid #dadce0; border-radius: 4px; }
        #rain-data table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
        #rain-data th, #rain-data td { padding: .15rem .45rem; text-align: right; white-space: nowrap; }
        #rain-data thead th { position: sticky; top: 0; background: #f8f9fa; box-shadow: 0 1px 0 #dadce0; }
        .rain-hours tbody tr { cursor: pointer; }
        .rain-hours tbody tr:hover { background: #f1f3f4; }
        .rain-hours tbody tr.on { background: #e8f0fe; font-weight: 600; }
        .rain-matrix th { background: #f8f9fa; color: #5f6368; font-weight: 500; }
        .rain-matrix td.dry { color: #bdc1c6; }
        #rain-data details { margin-top: .75rem; }
        #rain-data pre { max-height: 16rem; overflow: auto; background: #f8f9fa; padding: .5rem;
                         font-size: .72rem; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Welcome To SIH26085</h1>

    <button id="use-location" type="button">Use My Location</button>
    <p id="location-status" aria-live="polite"></p>

    <form id="district-form">
        <input id="district" name="district" aria-label="District or city"
               placeholder="District name, e.g. Kanchipuram"
               required minlength="2" maxlength="80" autocomplete="address-level2">
        <button type="submit">Get Weather</button>
    </form>
    <div id="weather" aria-live="polite"></div>
    <div id="forecast" aria-live="polite"></div>

    <div id="map"></div>
    <section id="rain-data" hidden></section>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- Order matters: location.js creates the map that layers.js and weather.js use. -->
    <script src="{{ url_for('static', path='js/location.js') }}"></script>
    <script src="{{ url_for('static', path='js/layers.js') }}"></script>
    <script src="{{ url_for('static', path='js/weather.js') }}"></script>
</body>
</html>
