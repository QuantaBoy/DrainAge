<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#F7F6F3">
    <title>{% block title %}Chennai Flood Nowcast{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%232F3437%22/%3E%3Cpath d=%22M16 7s7 7.6 7 13a7 7 0 0 1-14 0c0-5.4 7-13 7-13z%22 fill=%22%23fff%22/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,500&display=swap">
    {% block head %}{% endblock %}
    <link rel="stylesheet" href="{{ url_for('static', path='css/home.css') }}?v={{ asset_v }}">
    <!-- Before first paint, so a remembered palette does not flash the default. The site
         is light only. -->
    <script>
        (() => {
            const root = document.documentElement;
            const stored = (key) => { try { return localStorage.getItem(key); } catch (err) { return null; } };
            root.dataset.palette = stored("palette") || "monsoon";
            root.dataset.theme = "light";
        })();
    </script>
</head>
<body class="{% block body_class %}{% endblock %}">
{% block defs %}{% endblock %}

<div class="{% block shell %}app{% endblock %}">

    <header class="topbar">
        <a class="brand" href="/">
            <span class="brand-mark" aria-hidden="true">◆</span>
            <span class="brand-name">{% block brand %}Flood Nowcast{% endblock %}</span>
        </a>

        {% set path = request.url.path %}
        <nav class="nav" aria-label="Primary">
            <a href="/" {% if path == "/" %}aria-current="page"{% endif %}>Dashboard</a>
            <a href="/resources" {% if path.startswith("/resources") %}aria-current="page"{% endif %}>Resources</a>
            <a href="/technology" {% if path.startswith("/technology") %}aria-current="page"{% endif %}>Technology</a>
        </nav>

        {% block controls %}{% endblock %}


        <div class="palette" role="group" aria-label="Colour palette">
            <button type="button" data-palette="monsoon" style="--swatch: #3b6ef6"
                    aria-label="Monsoon blue"></button>
            <button type="button" data-palette="lagoon" style="--swatch: #0f9488"
                    aria-label="Lagoon teal"></button>
            <button type="button" data-palette="clay" style="--swatch: #d2603a"
                    aria-label="Clay terracotta"></button>
        </div>
    </header>

    {% block content %}{% endblock %}

</div>

{% block scripts %}{% endblock %}
<script src="{{ url_for('static', path='js/theme.js') }}?v={{ asset_v }}"></script>
</body>
</html>
