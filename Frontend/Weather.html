<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather & GIS World Map</title>
    <!-- Leaflet.js GIS Mapping Library CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: sans-serif; margin: 20px; }
        #map { height: 450px; width: 100%; border-radius: 8px; margin-top: 15px; border: 1px solid #ccc; }
        #result { background: #f4f4f4; padding: 12px; border-radius: 6px; margin-top: 15px; }
    </style>
</head>
<body>
    <h2>Weather Data & GIS Interactive Map</h2>
    <form id="weather-form">
        <input id="city" type="text" placeholder="Enter city" required>
        <button type="submit">Get Weather</button>
    </form>
    
    <pre id="result"></pre>
    
    <hr>
    <h3>Flood Nowcast (3-Hour Runoff Volume Grid)</h3>
    <form id="rainfall-form">
        <input id="min_lat" type="number" step="any" placeholder="Min Lat (e.g. 12.85)" required>
        <input id="max_lat" type="number" step="any" placeholder="Max Lat (e.g. 13.23)" required>
        <input id="min_lon" type="number" step="any" placeholder="Min Lon (e.g. 80.14)" required>
        <input id="max_lon" type="number" step="any" placeholder="Max Lon (e.g. 80.33)" required>
        <button type="submit">Calculate Runoff Volume</button>
    </form>
    <pre id="rainfall-result" style="background: #eef; padding: 12px; border-radius: 6px; margin-top: 15px;"></pre>
    <hr>

    <h3>World Map (Click anywhere to inspect weather)</h3>
    <div id="map"></div>

    <!-- Leaflet.js GIS Mapping Library Script -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="weather.js"></script>
</body>
</html>
