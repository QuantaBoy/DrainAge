<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flood Nowcast Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body { margin: 0; height: 100%; }
        #map { height: 100%; width: 100%; }
        #layer-toggle { position: absolute; top: 10px; right: 10px; z-index: 1000; background: white; padding: 8px; border-radius: 6px; font-family: sans-serif; }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="layer-toggle">
        <label><input type="checkbox" id="toggle-rainfall" checked> Rainfall</label><br>
        <label><input type="checkbox" id="toggle-flood" checked> Flood depth</label>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="map.js"></script>
</body>
</html>
